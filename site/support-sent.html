<!DOCTYPE html>
<html lang="en">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-BY93CRYSZK"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-BY93CRYSZK');

  // Outbound App Store clicks -> GA4. 2026-09-11: the site has carried GA4 since
  // launch but NOTHING fired when someone left for the App Store, so every content
  // channel was unmeasurable — `app_store_click` had zero events in the app's whole
  // history. Delegated on document so it covers every store link on the page,
  // including ones added later, without editing each anchor.
  document.addEventListener('click', function (e) {
    var n = e.target && e.target.nodeType === 1 ? e.target : (e.target && e.target.parentElement);
    var a = n && n.closest ? n.closest('a[href*="apps.apple.com"]') : null;
    if (!a) return;
    var q = new URLSearchParams(location.search);
    gtag('event', 'app_store_click', {
      link_url:  a.href,
      page_path: location.pathname,
      utm_source:   q.get('utm_source')   || '(none)',
      utm_medium:   q.get('utm_medium')   || '(none)',
      utm_campaign: q.get('utm_campaign') || '(none)'
    });
  }, true);

</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ticket sent — iLovu</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --coral:#FF6B6B; --blush:#FFF5F3; --rose:#C44569; --ink:#2B1B1E; --ink-soft:#6B5458; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Plus Jakarta Sans',-apple-system,sans-serif; background:var(--blush); color:var(--ink);
         min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; }
  .card { background:#fff; border-radius:28px; padding:56px 44px; max-width:480px; box-shadow:0 30px 70px -35px rgba(196,69,105,0.3); }
  h1 { font-family:'Fraunces',serif; font-weight:500; font-size:34px; margin-bottom:10px; }
  p { color:var(--ink-soft); font-size:15.5px; line-height:1.7; margin-bottom:22px; }
  a { display:inline-block; background:linear-gradient(120deg,#FF6B6B,#FF8E53); color:#fff; font-weight:700;
      font-size:15px; padding:12px 28px; border-radius:100px; text-decoration:none; }
</style>
</head>
<body>
  <div class="card">
    <h1>Ticket sent 💌</h1>
    <p>Thanks for reaching out — we've received your message and will reply within 1–2 business days at the email you provided.</p>
    <a href="support.html">Back to Support</a>
  </div>
</body>
</html>
